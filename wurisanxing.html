<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>吾日三省</title>
<style>
:root{--bg:#f1e4f6;--card:#fdfbff;--bd:#ddd6e8;--bd2:#cdc9e8;--main:#67476a;--g:#7d6ca4;--gl:#e8e5f5;--o:#ba91b2;--ol:#f2e2ec;--t2:#8b84ae;--t3:#a6aec7;--focus:#8974ba;--cg:#dcdbee;--co:#e3c9ed;--ce:#e8e5f5;--text:#4a3a52}
@media (prefers-color-scheme:dark){:root{--bg:#1d1625;--card:#2a2134;--bd:#433a54;--bd2:#54496b;--main:#e3cfe8;--g:#a99ad0;--gl:#3a3454;--o:#d0a8c8;--ol:#4a3446;--t2:#a59fc4;--t3:#8a8fa8;--focus:#a894d6;--cg:#3d3a5c;--co:#55365f;--ce:#3a3454;--text:#e8dff0}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
h1,h2{font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;color:var(--main);margin:0}
h1{font-size:28px;line-height:1.3;text-align:center;padding:8px 0 2px;cursor:pointer}
h2{font-size:18px;margin-bottom:8px}
.date,.stat{text-align:center}
.date{color:var(--t2);font-size:15px}
.stat{font-size:16px;margin:4px 0 8px;color:var(--main);display:flex;justify-content:center;flex-wrap:wrap;gap:2px 14px}
.sg{color:var(--gx,var(--g))}.so{color:var(--ox,var(--o))}
.hG{color:var(--gx,var(--g))}.hO{color:var(--ox,var(--o))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.btn,.foot button,.add{font:inherit;font-size:15px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--bd2);background:var(--card);color:var(--main);cursor:pointer}
.center,.backbar,.foot{display:flex;justify-content:center;gap:10px;margin:12px 0}
.scope .btn.on{background:var(--focus);border-color:var(--focus);color:var(--fg,#fff)}
.hintline{text-align:center;font-size:13px;color:var(--t2);margin:-4px 0 8px}
.foot button{flex:1;max-width:200px}
.btn.pri{background:var(--focus);border-color:var(--focus);color:var(--fg,#fff)}
.row{display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 10px;border-radius:10px;cursor:pointer;user-select:none}
.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--bd2);display:grid;place-items:center;color:transparent;font-size:16px}
.row.g.on{background:var(--gl)}.row.g.on .chk{background:var(--g);border-color:var(--g);color:var(--chkg,#fff)}
.row.o.on{background:var(--ol)}.row.o.on .chk{background:var(--o);border-color:var(--o);color:var(--chko,#fff)}
.ro .row{cursor:default}
.empty{color:var(--t2);padding:8px 10px;font-size:14px}
.erow{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.drag{flex:none;width:34px;align-self:stretch;display:flex;align-items:center;justify-content:center;color:var(--t3);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-size:20px}
.erow.dragging{opacity:.45}
.erow.dragging .drag{cursor:grabbing}
.erow input,.mbox input{flex:1;min-width:0;height:44px;padding:0 12px;font:inherit;font-size:16px;border:1px solid var(--bd2);border-radius:10px;background:var(--card);color:var(--text)}
.del{flex:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--bd2);background:transparent;color:var(--o);font-size:24px;cursor:pointer}
.add{width:100%;border-style:dashed;color:var(--t2)}
textarea{width:100%;min-height:110px;resize:vertical;padding:12px;font:inherit;font-size:16px;line-height:1.6;border:1px solid var(--bd2);border-radius:12px;background:var(--card);color:var(--text)}
textarea::placeholder,input::placeholder{color:var(--t3)}
textarea:focus,input:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 2px color-mix(in srgb,var(--focus) 30%,transparent)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.tab{min-height:40px;padding:0;border-radius:10px;border:1px solid var(--bd);background:transparent;color:var(--t2);font:inherit;font-size:13px;cursor:pointer}
.tab.on{background:var(--focus);border-color:var(--focus);color:var(--fg,#fff)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.grid.y{grid-template-columns:repeat(4,1fr)}
.grid.wk{margin-bottom:6px;text-align:center;color:var(--t2);font-size:12px}
.cell{min-height:46px;aspect-ratio:1;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--text);font:inherit;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;cursor:pointer}
.cell small{font-size:11px;color:var(--t2)}
.cell.ymo{aspect-ratio:auto;min-height:64px}
.cg{background:var(--cg)}.co{background:var(--co)}.ce{background:var(--ce)}
.ct{border:1.5px dashed var(--focus)}
.cell.tod{outline:2px solid var(--main);outline-offset:-2px}
.cell.sel{outline:2px solid var(--focus);outline-offset:-2px}
.cell.fut{opacity:.35;cursor:default}
.mt{text-align:center;color:var(--main);font-family:"Noto Serif SC","Songti SC",serif;margin-bottom:8px}
.pick{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
.pick select{min-height:40px;padding:0 10px;font:inherit;font-size:15px;border-radius:10px;border:1px solid var(--bd2);background:var(--card);color:var(--text)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;margin-top:12px;font-size:12px;color:var(--t2);align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px;border:1px solid var(--bd)}
.legend i.ct{border:1.5px dashed var(--focus);background:none}
#modal,#modal2,#themeModal{position:fixed;inset:0;background:rgba(40,20,50,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
.mbox{background:var(--card);border-radius:14px;padding:18px;width:100%;max-width:360px}
.mbox h2{margin-bottom:10px}
.mbox input{width:100%;margin-bottom:12px}
.mbtn{display:flex;gap:10px;justify-content:flex-end}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:52vh;overflow:auto;margin-bottom:12px}
.theme{display:flex;flex-direction:column;align-items:flex-start;gap:7px;padding:10px;border-radius:10px;border:1px solid var(--bd2);background:var(--card);color:var(--text);font:inherit;font-size:14px;cursor:pointer}
.theme.on{border-color:var(--focus);box-shadow:inset 0 0 0 2px var(--focus)}
.dots{display:flex;gap:4px}
.dots i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.1)}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title" role="button" tabindex="0"></h1>
  <div class="date" id="date"></div>
  <div class="stat" id="stat"></div>
  <div class="backbar" id="back" hidden><button class="btn pri" id="backBtn">回到今天</button></div>

  <section class="card"><h2 class="hG">功</h2><div id="listG"></div></section>
  <section class="card"><h2 class="hO">过</h2><div id="listO"></div></section>
  <div class="center"><button class="btn" id="editBtn">编辑项目</button><button class="btn" id="resetBtn" hidden>恢复默认</button></div>
  <div class="center scope" id="scopeBar" hidden><button class="btn" id="scopeToday">仅今天</button><button class="btn" id="scopeAll">永久修改</button></div>
  <div class="hintline" id="scopeHint" hidden>仅今天：明天恢复原清单　·　永久：以后每天沿用　·　拖动 ≡ 排序</div>

  <section class="card"><h2>自我反省</h2><textarea id="fb" placeholder="今天做对了什么，做错了什么，明天要改什么。"></textarea></section>
  <section class="card"><h2>今日感悟</h2><textarea id="ins" placeholder="今天想到的、看见的、想记住的。"></textarea></section>

  <section class="card">
    <h2>记录</h2>
    <div class="tabs" id="tabs"></div>
    <div id="hist"></div>
    <div class="legend"><span><i class="cg"></i>功多</span><span><i class="co"></i>过多</span><span><i class="ce"></i>一样多</span><span><i class="ct"></i>仅文字</span></div>
    <div class="center"><button class="btn" id="copyRecent">问AI</button></div>
  </section>

  <div class="foot"><button id="themeBtn">配色</button><button id="exp">导出备份</button><button id="imp">导入备份</button><input type="file" id="file" accept=".json,application/json" hidden></div>
</div>

<div id="modal" hidden>
  <div class="mbox">
    <h2>修改标题</h2>
    <input id="mi" maxlength="20" placeholder="瑜の吾日三省">
    <div class="mbtn"><button class="btn" id="mcancel">取消</button><button class="btn pri" id="mok">保存</button></div>
  </div>
</div>

<div id="modal2" hidden><div class="mbox"><h2 id="m2t"></h2><p id="m2d" style="margin:0 0 10px;font-size:14px;color:var(--t2)"></p><textarea id="m2a" style="min-height:150px;font-size:16px"></textarea><div class="mbtn" style="margin-top:12px;flex-wrap:wrap" id="m2b"></div></div></div>

<div id="themeModal" hidden>
  <div class="mbox">
    <h2>配色</h2>
    <div class="themes" id="themeList"></div>
    <div class="mbtn"><button class="btn" id="themeClose">关闭</button></div>
  </div>
</div>
<script>
const KEY='wrsx_v1',DEF_TITLE='瑜の吾日三省',WD='日一二三四五六';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const TODAY=()=>key(new Date());
const defItems=()=>({
  g:['早上不赖床','学习至少一个AI知识','阅读30分钟','运动20分钟','望远20分钟'].map((n,i)=>({id:'g'+(i+1),name:n})),
  o:['背后议论别人','拖延或浪费时间','傲慢自负','恶意揣测别人','发表一次不良言论'].map((n,i)=>({id:'o'+(i+1),name:n}))
});
function load(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY));
    if(s&&s.items&&s.days){
      Object.values(s.days).forEach(d=>{d.g=d.g||[];d.o=d.o||[];d.reflect=d.reflect||'';d.insight=d.insight||''});
      return s;
    }
  }catch(e){}
  return {title:DEF_TITLE,items:defItems(),days:{}};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load();

/* 配色主题 */
const THEMES={
  default:{name:'默认',dots:['#f1e4f6','#fdfbff','#7d6ca4','#ba91b2','#67476a']},
  mint:{name:'薄荷',dots:['#EAF6E8','#C1E4D2','#91CBB8','#E8C7D1','#536F65'],
    bg:'#EAF6E8',card:'#E3F3EB',g:'#91CBB8',o:'#E8C7D1',main:'#536F65'},
  ice:{name:'冰露',dots:['#F0F8F8','#C6EAE5','#9BCFD8','#D7DDF4','#627C91'],
    bg:'#F0F8F8',card:'#E5F6F3',g:'#9BCFD8',o:'#D7DDF4',main:'#627C91'},
  spring:{name:'初春',dots:['#F4F6DF','#DCE6B8','#B7CE91','#EACFC0','#727D58'],
    bg:'#F4F6DF',card:'#EFF4DF',g:'#B7CE91',o:'#EACFC0',main:'#727D58'},
  candy:{name:'糖果',dots:['#FBF3E5','#E9D6AD','#C7DEB9','#E6C1C8','#7B8D78'],
    bg:'#FBF3E5',card:'#F5ECDA',g:'#C7DEB9',o:'#E6C1C8',main:'#7B8D78'},
  sea:{name:'海底',dots:['#E9F4F3','#A9D5D1','#C5E1C5','#F0C9B8','#657F78'],
    bg:'#E9F4F3',card:'#E5F1E5',g:'#A9D5D1',o:'#F0C9B8',main:'#657F78'},
  bubble:{name:'泡泡',dots:['#FFF4DF','#EBD5A8','#D9E6B9','#E7BFCB','#847B91'],
    bg:'#FFF4DF',card:'#F6ECD8',g:'#D9E6B9',o:'#E7BFCB',main:'#847B91'},
  sakura:{name:'夜樱',dots:['#F0D9E4','#C1A0AC','#806C79','#4A3F4B','#16131F'],
    bg:'#F0D9E4',card:'#F8EDF2',g:'#C1A0AC',o:'#806C79',main:'#4A3F4B',text:'#3A2E3C'},
  cedar:{name:'雪松',dots:['#23354D','#495B7D','#8BA3C5','#F0ECDD','#02122F'],
    bg:'#23354D',card:'#495B7D',g:'#8BA3C5',o:'#F0ECDD',main:'#F0ECDD',text:'#F0ECDD'},
  fog:{name:'冷雾',dots:['#292A2A','#414445','#5C6263','#8F9295','#BEC0C2'],
    bg:'#292A2A',card:'#414445',g:'#8F9295',o:'#5C6263',main:'#BEC0C2',text:'#BEC0C2',bd:'#5C6263'}
};
const THEME_VARS=['--bg','--card','--bd','--bd2','--main','--g','--gl','--gx','--o','--ol','--ox','--t2','--t3','--focus','--cg','--co','--ce','--text','--chkg','--chko','--fg'];
function hex2rgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function mix(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);return '#'+A.map((v,i)=>Math.round(v*(1-t)+B[i]*t).toString(16).padStart(2,'0')).join('')}
function lum(h){const c=hex2rgb(h).map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)});return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2]}
function cr(a,b){const A=lum(a),B=lum(b);return (Math.max(A,B)+0.05)/(Math.min(A,B)+0.05)}
function themeVars(t){
  const dark=lum(t.bg)<0.4;
  const text=t.text||(dark?mix(t.main,'#ffffff',0.04):mix(t.main,'#000000',0.45));
  const bd=t.bd||mix(t.card,t.main,dark?0.3:0.16);
  const bd2=t.bd2||mix(t.card,t.main,dark?0.45:0.28);
  const focus=mix(t.g,t.main,0.12);
  const gx=dark?mix(t.g,t.main,0.55):mix(t.g,text,0.6);
  const ox=dark?mix(t.o,t.main,0.55):mix(t.o,text,0.6);
  return {
    '--bg':t.bg,'--card':t.card,'--bd':bd,'--bd2':bd2,
    '--main':t.main,'--text':text,
    '--t2':mix(t.bg,t.main,0.62),
    '--t3':mix(t.bg,t.main,dark?0.5:0.45),
    '--g':t.g,'--gl':mix(t.card,t.g,0.22),'--gx':gx,'--cg':mix(t.card,t.g,0.24),
    '--o':t.o,'--ol':mix(t.card,t.o,0.22),'--ox':ox,'--co':mix(t.card,t.o,0.24),
    '--ce':mix(t.card,t.g,0.12),'--focus':focus,
    '--chkg':lum(t.g)>0.35?'#2b2b2b':'#ffffff',
    '--chko':lum(t.o)>0.35?'#2b2b2b':'#ffffff',
    '--fg':cr(focus,'#ffffff')>=cr(focus,'#2b2b2b')?'#ffffff':'#2b2b2b'
  };
}
function applyTheme(id){
  const root=document.documentElement,t=THEMES[id];
  const meta=document.querySelector('meta[name="theme-color"]');
  THEME_VARS.forEach(v=>root.style.removeProperty(v));
  root.style.colorScheme='';
  if(!t||id==='default'){
    if(meta)meta.setAttribute('content','#f1e4f6');
    return;
  }
  const vars=themeVars(t);
  Object.keys(vars).forEach(k=>root.style.setProperty(k,vars[k]));
  root.style.colorScheme=lum(t.bg)<0.4?'dark':'light';
  if(meta)meta.setAttribute('content',t.bg);
}
function renderThemes(){
  const cur=S.theme||'default';
  $('themeList').innerHTML=Object.keys(THEMES).map(id=>{
    const t=THEMES[id];
    return `<button class="theme${id===cur?' on':''}" data-theme="${id}"><span class="tname">${t.name}</span><span class="dots">${t.dots.map(c=>`<i style="background:${c}"></i>`).join('')}</span></button>`;
  }).join('');
}

let view=null,mode='7',editing=false,lastToday=TODAY(),work=null,scope='today';
let hy=new Date().getFullYear(),hm=new Date().getMonth()+1;

function touch(){
  const k=TODAY();
  let d=S.days[k];
  if(!d)d=S.days[k]={g:[],o:[],snap:null,reflect:'',insight:''};
  d.snap=clone(d.override&&d.items?d.items:S.items);
  return d;
}
function ensureDay(k){
  let d=S.days[k];
  if(!d)d=S.days[k]={g:[],o:[],snap:null,reflect:'',insight:''};
  return d;
}
function dayItems(k){
  const d=S.days[k];
  return (d&&d.override&&d.items)?d.items:S.items;
}
function syncToday(){
  const d=S.days[TODAY()];
  if(!d)return;
  d.snap=clone(S.items);
  ['g','o'].forEach(t=>d[t]=d[t].filter(id=>S.items[t].some(i=>i.id===id)));
}
function streak(){
  const has=k=>{const d=S.days[k];return d&&d.g.length+d.o.length>0};
  let n=0,c=new Date();
  if(!has(key(c)))c.setDate(c.getDate()-1);
  while(has(key(c))){n++;c.setDate(c.getDate()-1)}
  return n;
}
function totalDays(){
  return Object.keys(S.days).filter(k=>{
    const d=S.days[k];
    return d&&(d.g.length+d.o.length)>0;
  }).length;
}
function cellInfo(k){
  const d=S.days[k];
  const g=d?d.g.length:0,o=d?d.o.length:0;
  let c='';
  if(g+o>0)c=g>o?'cg':o>g?'co':'ce';
  else if(d&&(d.reflect.trim()||d.insight.trim()))c='ct';
  return c;
}

function render(){
  const k=view||TODAY(),d=S.days[k],dt=parse(k);
  $('title').textContent=S.title||DEF_TITLE;
  $('date').textContent=`${dt.getMonth()+1}月${dt.getDate()}日 周${WD[dt.getDay()]} · ${view?'历史记录 · 可修改':'今天'}`;
  $('stat').innerHTML=`<b class="sg">功 ${d?d.g.length:0}</b><b class="so">过 ${d?d.o.length:0}</b><span>连续 ${streak()} 天</span><span>累计 ${totalDays()} 天</span>`;
  $('back').hidden=!view;
  $('editBtn').hidden=!!view;
  $('editBtn').textContent=editing?'完成编辑':'编辑项目';
  $('resetBtn').hidden=!editing||!!view;
  const showScope=editing&&!view;
  $('scopeBar').hidden=!showScope;
  $('scopeHint').hidden=!showScope;
  $('scopeToday').classList.toggle('on',scope==='today');
  $('scopeAll').classList.toggle('on',scope==='all');
  renderList('g');renderList('o');renderHist();
}
function renderList(t){
  const k=view||TODAY(),d=S.days[k],ro=!!view;
  const box=$(t==='g'?'listG':'listO');
  const items=ro?(d&&d.snap?d.snap[t]:dayItems(k)[t]):(editing?work[t]:dayItems(k)[t]);
  if(editing&&!ro){
    box.innerHTML=items.map(i=>`<div class="erow" data-id="${i.id}"><span class="drag" data-t="${t}" aria-label="拖动排序">≡</span><input data-t="${t}" data-id="${i.id}" value="${esc(i.name)}" maxlength="30" placeholder="项目名称"><button class="del" data-t="${t}" data-id="${i.id}" aria-label="删除">×</button></div>`).join('')+`<button class="add" data-t="${t}">＋ 新增一项</button>`;
    return;
  }
  const on=d?d[t]:[];
  box.innerHTML=items.length?items.map(i=>`<div class="row ${t} ${on.includes(i.id)?'on':''}" data-t="${t}" data-id="${i.id}"><span class="chk">✓</span><span>${esc(i.name)}</span></div>`).join(''):`<div class="empty">${ro?'当天没有记录':'暂无项目'}</div>`;
}
function grow(el){
  el.style.height='auto';
  el.style.height=(el.scrollHeight+(el.offsetHeight-el.clientHeight))+'px';
}
function fillTexts(){
  const d=S.days[view||TODAY()];
  $('fb').value=d?d.reflect:'';
  $('ins').value=d?d.insight:'';
  grow($('fb'));grow($('ins'));
}
function goView(k){
  if(editing){finishEdit();editing=false;work=null;}
  view=k===TODAY()?null:k;
  fillTexts();render();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* 历史 */
function cell(k,label){
  const fut=k>TODAY();
  return `<button class="cell ${cellInfo(k)} ${fut?'fut':''} ${k===TODAY()?'tod':''} ${k===view?'sel':''}" data-k="${k}" ${fut?'disabled':''}>${label}</button>`;
}
function calendar(y,m){
  const first=(new Date(y,m-1,1).getDay()+6)%7,n=new Date(y,m,0).getDate();
  let h='<div class="grid wk">'+[...'一二三四五六日'].map(c=>`<span>${c}</span>`).join('')+'</div><div class="grid">';
  for(let i=0;i<first;i++)h+='<span></span>';
  for(let d=1;d<=n;d++)h+=cell(`${y}-${pad(m)}-${pad(d)}`,d);
  return h+'</div>';
}
function renderHist(){
  const tabs=[['7','最近7天'],['w','本周'],['m','本月'],['y','本年'],['p','自选']];
  $('tabs').innerHTML=tabs.map(([m,l])=>`<button class="tab ${m===mode?'on':''}" data-m="${m}">${l}</button>`).join('');
  const T=new Date(),y=T.getFullYear();
  let h='';
  if(mode==='7'||mode==='w'){
    const st=new Date(y,T.getMonth(),T.getDate());
    st.setDate(st.getDate()-(mode==='7'?6:(st.getDay()+6)%7));
    h='<div class="grid">';
    for(let i=0;i<7;i++){
      const x=new Date(st);x.setDate(st.getDate()+i);
      h+=cell(key(x),`<small>周${WD[x.getDay()]}</small>${x.getDate()}`);
    }
    h+='</div>';
  }else if(mode==='y'){
    h='<div class="mt">'+y+' 年</div><div class="grid y">';
    for(let m=1;m<=12;m++){
      const pre=`${y}-${pad(m)}-`;
      const n=Object.keys(S.days).filter(k=>k.startsWith(pre)&&cellInfo(k)).length;
      h+=`<button class="cell ymo" data-ym="${m}"><small>${m}月</small>${n} 天</button>`;
    }
    h+='</div>';
  }else if(mode==='m'){
    h=`<div class="mt">${y} 年 ${T.getMonth()+1} 月</div>`+calendar(y,T.getMonth()+1);
  }else{
    const minY=Math.min(y,...Object.keys(S.days).map(k=>+k.slice(0,4)));
    let ys='',ms='';
    for(let i=minY;i<=y;i++)ys+=`<option value="${i}" ${i===hy?'selected':''}>${i} 年</option>`;
    for(let i=1;i<=12;i++)ms+=`<option value="${i}" ${i===hm?'selected':''}>${i} 月</option>`;
    h=`<div class="pick"><select id="sy">${ys}</select><select id="sm">${ms}</select></div>`+calendar(hy,hm);
  }
  $('hist').innerHTML=h;
}
$('tabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab');if(!b)return;
  mode=b.dataset.m;
  if(mode==='p'){hy=new Date().getFullYear();hm=new Date().getMonth()+1}
  renderHist();
});
$('hist').addEventListener('click',e=>{
  const c=e.target.closest('[data-k]');
  if(c&&!c.disabled)return goView(c.dataset.k);
  const y=e.target.closest('[data-ym]');
  if(y){mode='p';hy=new Date().getFullYear();hm=+y.dataset.ym;renderHist()}
});
$('hist').addEventListener('change',e=>{
  if(e.target.id==='sy'){hy=+e.target.value;renderHist()}
  if(e.target.id==='sm'){hm=+e.target.value;renderHist()}
});

/* 勾选与编辑项目 */
function listClick(e){
  const el=e.target.closest('.row,.del,.add');if(!el)return;
  const t=el.dataset.t,id=el.dataset.id;
  if(el.classList.contains('row')){
    const k=view||TODAY(),d=ensureDay(k);
    if(!d.snap)d.snap=clone(dayItems(k));
    const a=d[t],i=a.indexOf(id);
    i>=0?a.splice(i,1):a.push(id);
    save();render();
  }else if(el.classList.contains('del')){
    work[t]=work[t].filter(i=>i.id!==id);
    render();
  }else{
    work[t].push({id:'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:''});
    render();
    const ins=$(t==='g'?'listG':'listO').querySelectorAll('.erow input');
    ins[ins.length-1].focus();
  }
}
function listInput(e){
  const i=e.target;if(!i.matches('.erow input'))return;
  const it=work[i.dataset.t].find(x=>x.id===i.dataset.id);
  if(it)it.name=i.value;
}
['listG','listO'].forEach(id=>{$(id).addEventListener('click',listClick);$(id).addEventListener('input',listInput)});
/* 编辑模式：拖动 ≡ 排序 */
let drag=null;
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest('.drag');if(!h)return;
  const row=h.closest('.erow'),box=h.closest('#listG,#listO');
  if(!row||!box)return;
  e.preventDefault();
  drag={row,box,t:h.dataset.t,pid:e.pointerId};
  row.classList.add('dragging');
  try{h.setPointerCapture(e.pointerId)}catch(x){}
},{passive:false});
document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.pid)return;
  e.preventDefault();
  const under=document.elementFromPoint(e.clientX,e.clientY);
  const target=under&&under.closest('.erow');
  if(target&&target!==drag.row&&target.parentNode===drag.box){
    const r=target.getBoundingClientRect();
    drag.box.insertBefore(drag.row,e.clientY>r.top+r.height/2?target.nextSibling:target);
  }
},{passive:false});
function endDrag(e){
  if(!drag||(e&&e.pointerId!==drag.pid))return;
  const {row,box,t}=drag;
  row.classList.remove('dragging');
  const ids=[...box.querySelectorAll('.erow')].map(r=>r.dataset.id);
  const map={};work[t].forEach(i=>map[i.id]=i);
  work[t]=ids.map(id=>map[id]).filter(Boolean);
  drag=null;
}
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);
function finishEdit(){
  if(!work)return;
  ['g','o'].forEach(t=>{
    work[t]=work[t].map(i=>({id:i.id,name:(i.name||'').trim()})).filter(i=>i.name);
  });
  const k=TODAY(),d=S.days[k];
  if(scope==='all'){
    S.items=work;
    if(d){
      d.override=false;delete d.items;
      d.snap=clone(S.items);
      ['g','o'].forEach(t=>d[t]=d[t].filter(id=>S.items[t].some(i=>i.id===id)));
    }
  }else{
    const day=d||(S.days[k]={g:[],o:[],snap:null,reflect:'',insight:''});
    day.override=true;day.items=clone(work);day.snap=clone(work);
    ['g','o'].forEach(t=>day[t]=day[t].filter(id=>work[t].some(i=>i.id===id)));
  }
  save();
}
$('editBtn').onclick=()=>{
  if(!editing){
    const d=S.days[TODAY()];
    work=clone((d&&d.override&&d.items)?d.items:S.items);
    scope='today';
    editing=true;
  }else{
    finishEdit();editing=false;work=null;
  }
  render();
};
$('scopeToday').onclick=()=>{scope='today';render()};
$('scopeAll').onclick=()=>{scope='all';render()};
$('resetBtn').onclick=()=>{
  if(!confirm('把编辑中的清单恢复成最初的 5 功 5 过？点“完成编辑”后生效。'))return;
  work=defItems();render();
};
$('backBtn').onclick=()=>goView(TODAY());

/* 文本自动保存 */
[['fb','reflect'],['ins','insight']].forEach(([id,f])=>$(id).addEventListener('input',e=>{
  grow(e.target);
  ensureDay(view||TODAY())[f]=e.target.value;
  save();renderHist();
}));

/* 标题 */
function openTitle(){$('mi').value=S.title||DEF_TITLE;$('modal').hidden=false;$('mi').focus();$('mi').select()}
$('title').onclick=openTitle;
$('title').onkeydown=e=>{if(e.key==='Enter')openTitle()};
$('mok').onclick=()=>{S.title=$('mi').value.trim()||DEF_TITLE;save();$('modal').hidden=true;render()};
$('mcancel').onclick=()=>$('modal').hidden=true;
$('mi').onkeydown=e=>{if(e.key==='Enter')$('mok').click();if(e.key==='Escape')$('mcancel').click()};
$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').hidden=true};

/* 备份 */
$('exp').onclick=()=>{
  const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download='吾日三省备份-'+TODAY()+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
$('imp').onclick=()=>$('file').click();
$('file').onchange=e=>{
  const f=e.target.files[0];e.target.value='';
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    let o;
    try{
      o=JSON.parse(r.result);
      if(!o||!o.items||!Array.isArray(o.items.g)||!Array.isArray(o.items.o)||!o.days||typeof o.days!=='object')throw 0;
    }catch(x){alert('备份文件无效，无法导入');return}
    if(!confirm('导入将覆盖当前所有数据，确定继续吗？'))return;
    try{localStorage.setItem(KEY,JSON.stringify(o))}catch(x){alert('保存失败');return}
    location.reload();
  };
  r.readAsText(f);
};

/* 备份：复制/粘贴方式（网页里下载文件可能被拦截） */
function m2(title,desc,text,ro,btns){
  $('m2t').textContent=title;$('m2d').textContent=desc;
  const a=$('m2a');a.value=text;a.readOnly=ro;
  $('m2b').innerHTML='';
  btns.forEach(([l,f,p])=>{const b=document.createElement('button');b.className='btn'+(p?' pri':'');b.textContent=l;b.dataset.label=l;b.onclick=ev=>f(ev.target);$('m2b').appendChild(b)});
  $('modal2').hidden=false;
}
const closeM2=()=>{$('modal2').hidden=true};
$('modal2').onclick=e=>{if(e.target===$('modal2'))closeM2()};
async function copyText(t,btn){
  try{await navigator.clipboard.writeText(t);btn.textContent='已复制'}
  catch(e){const a=$('m2a');a.focus();a.select();try{document.execCommand('copy');btn.textContent='已复制'}catch(x){btn.textContent='请长按全选复制'}}
}
function dlFile(t){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));
  a.download='吾日三省备份-'+TODAY()+'.json';
  document.body.appendChild(a);a.click();a.remove();
}
function doImport(t){
  let o;
  try{
    o=JSON.parse(t);
    if(!o||!o.items||!Array.isArray(o.items.g)||!Array.isArray(o.items.o)||!o.days||typeof o.days!=='object')throw 0;
  }catch(x){alert('备份内容无效，无法导入');return}
  if(!confirm('导入将覆盖当前所有数据，确定继续吗？'))return;
  try{localStorage.setItem(KEY,JSON.stringify(o))}catch(x){alert('保存失败');return}
  location.reload();
}
$('exp').onclick=()=>{
  const t=JSON.stringify(S);
  m2('导出备份','点「复制」，粘贴到备忘录保存即可。也可以试试下载文件。',t,true,[['复制',b=>copyText(t,b),1],['下载文件',()=>dlFile(t)],['关闭',closeM2]]);
};
$('imp').onclick=()=>m2('导入备份','把之前复制的备份内容粘贴到下面，或选择备份文件。导入会覆盖当前所有数据。','',false,[['确认导入',()=>doImport($('m2a').value),1],['选择文件',()=>{closeM2();$('file').click()}],['取消',closeM2]]);

/* 导出：优先直接保存文件，不行再复制 */
$('exp').onclick=async()=>{
  const t=JSON.stringify(S,null,1),name='吾日三省备份-'+TODAY()+'.json';
  let dl=null;
  try{if(window.claude&&window.claude.use)dl=await window.claude.use('downloads')}catch(e){}
  if(!window.claude){dlFile(t);return}
  if(dl){
    try{await dl.save({filename:name,data:t});return}
    catch(e){if(e&&e.code==='declined')return}
  }
  m2('导出备份','点「复制」粘贴到备忘录保存，或试试下载文件。',t,true,[['下载文件',()=>dlFile(t),1],['复制',b=>copyText(t,b)],['关闭',closeM2]]);
};

/* 复制近期记录给 AI 分析 */
const COACH_PROMPT='请你作为我的反思教练，阅读下面的打卡记录，帮我找出我自己没察觉、但反复出现的问题或行为模式。\n要求：\n1. 只依据记录中的事实，不要编造或过度解读；每条模式都要附上日期，并引用我的原话或勾选项作为依据。记录太少、看不出模式时，直接说明，不要硬凑。\n2. 最多指出 2 个最明显的模式，按证据强弱排序。\n3. 最后给出 1–2 个明天就能做的、具体且小的改动，不要列一长串建议，也不要说教。\n4. 语气直接、平实，不要安慰式夸奖，不做心理诊断。\n以下是记录：';
function snapOf(k){const d=S.days[k];return d&&d.snap?d.snap:dayItems(k)}
function recentText(n){
  const end=new Date(),start=new Date(end);start.setDate(end.getDate()-n+1);
  const names=(k,t,ids)=>{
    const snap=snapOf(k);
    return ids.map(id=>{const it=snap[t].find(i=>i.id===id)||S.items[t].find(i=>i.id===id);return it?it.name:id});
  };
  const blocks=[];
  for(let i=0;i<n;i++){
    const x=new Date(start);x.setDate(start.getDate()+i);
    const k=key(x),d=S.days[k];
    if(!d)continue;
    const g=names(k,'g',d.g||[]),o=names(k,'o',d.o||[]);
    const fb=(d.reflect||'').trim(),ins=(d.insight||'').trim();
    if(!g.length&&!o.length&&!fb&&!ins)continue;
    const lines=[`${k} 周${WD[x.getDay()]}`];
    if(g.length)lines.push('功：'+g.join('、'));
    if(o.length)lines.push('过：'+o.join('、'));
    if(fb)lines.push('自我反省：'+fb);
    if(ins)lines.push('今日感悟：'+ins);
    blocks.push(lines.join('\n'));
  }
  const range=`记录范围：${key(start)} ～ ${key(end)}（最近 ${n} 天，有记录 ${blocks.length} 天）`;
  return COACH_PROMPT+'\n\n'+range+'\n\n'+(blocks.length?blocks.join('\n\n'):'（这段时间没有记录）');
}
function copyRecent(n,btn){
  const t=recentText(n);
  [...$('m2b').children].forEach(x=>x.textContent=x.dataset.label||x.textContent);
  $('m2a').value=t;
  $('m2d').textContent=`已生成最近 ${n} 天的记录。若没有自动复制，长按下方文本全选复制。`;
  copyText(t,btn);
}
$('copyRecent').onclick=()=>{
  m2('问AI','选择范围后会自动生成并复制，直接粘贴给 AI 即可。','',true,
    [['最近7天',b=>copyRecent(7,b),1],['最近30天',b=>copyRecent(30,b)],['关闭',closeM2]]);
};

window.addEventListener('resize',()=>{grow($('fb'));grow($('ins'))});

/* 跨天刷新 */
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&TODAY()!==lastToday){lastToday=TODAY();fillTexts();render()}
});

$('themeBtn').onclick=()=>{renderThemes();$('themeModal').hidden=false};
$('themeClose').onclick=()=>{$('themeModal').hidden=true};
$('themeModal').onclick=e=>{if(e.target===$('themeModal'))$('themeModal').hidden=true};
$('themeList').onclick=e=>{
  const b=e.target.closest('[data-theme]');if(!b)return;
  S.theme=b.dataset.theme;save();applyTheme(S.theme);renderThemes();
};
applyTheme(S.theme||'default');

fillTexts();render();
